 for(let i=0;i<5;i++){const z=((i*380+time*24)%1800)-900,x=91+Math.sin(time*.3+i)*9,y=100+(i%3)*32+Math.sin(time*2+i)*3;draw(droneMesh,x,y,z);for(const dx of [-7,7])for(const dz of [-7,7])draw(rotorMesh,x+dx,y+1,z+dz,1,time*19);}

function sync(){$('pause').textContent=paused?'▶ 继续':'Ⅱ 暂停';$('pause').setAttribute('aria-pressed',String(paused));$('status').textContent=paused?'HOLDING · 已暂停':'NIGHT FLIGHT · 夜航中';}
$('pause').onclick=()=>{paused=!paused;sync();};$('rain').onclick=()=>{rain=!rain;$('rain').textContent='雨幕 '+(rain?'ON':'OFF');$('rain').setAttribute('aria-pressed',String(rain));};$('speed').oninput=e=>{rate=Number(e.target.value);$('rate').textContent=rate.toFixed(2).replace(/0$/,'')+'×';};$('reset').onclick=()=>{yaw=Math.PI/4;zoom=defaultZoom;$('closeup').setAttribute('aria-pressed','false');};
$('closeup').onclick=()=>{const close=$('closeup').getAttribute('aria-pressed')!=='true';zoom=close?.23:defaultZoom;$('closeup').setAttribute('aria-pressed',String(close));};
$('hud').onclick=()=>{const on=$('hud').getAttribute('aria-pressed')!=='true';$('hud').setAttribute('aria-pressed',String(on));$('hud').textContent='信息 '+(on?'ON':'OFF');for(const node of document.querySelectorAll('.title,.camera,.bottom'))node.style.display=on?'':'none';};
$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('stage').requestFullscreen();}catch{$('full').textContent='全屏不可用';}};document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?'⛶ 退出全屏':'⛶ 全屏';});
let drag=null;canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,yaw};canvas.setPointerCapture(e.pointerId);});canvas.addEventListener('pointermove',e=>{if(drag)yaw=drag.yaw-(e.clientX-drag.x)*.005;});for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,()=>drag=null);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.16,Math.min(1.65,zoom+e.deltaY*.0006));$('closeup').setAttribute('aria-pressed',String(zoom<defaultZoom-.1));},{passive:false});
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();$('error').hidden=false;});canvas.addEventListener('webglcontextrestored',()=>location.reload());
document.addEventListener('visibilitychange',()=>last=0);matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{paused=e.matches;sync();});
sync();function frame(now){if(last&&!paused&&!document.hidden)time+=Math.min((now-last)/1000,.06)*rate;last=now;render();requestAnimationFrame(frame);}requestAnimationFrame(frame);
})();
