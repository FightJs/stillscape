if(gl){try{gl.bindTexture(gl.TEXTURE_2D,texture);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,art);}catch(e){console.warn('Texture upload unavailable; using original artwork',e);flow.hidden=true;gl=null;$('notice').textContent='局部柔性动画暂不可用，已切换为原画与光效。';}}
$('loading').hidden=true;$('error').hidden=true;$('backdrop').style.backgroundImage=`url("${art.src}")`;resize();if(!ctx)$('notice').textContent='当前浏览器不支持动态画布，正在展示原画。';else schedule();registerBridge();
};
art.onerror=()=>error('图片加载失败，请检查网络或稍后重试。原画：'+item.name);
function armTimeout(){clearTimeout(loadTimer);loadTimer=setTimeout(()=>error('加载原画超时，请重试或返回画廊重新选择作品。'),15000);}
window.addEventListener('message',event=>{
const data=event.data;
if(!embedded||event.source!==parent||!data||!['art-image','art-image-error'].includes(data.type)||data.id!==requested||!awaitingImage)return;
if(data.type==='art-image-error'){error('画廊暂时无法提供原画，请稍后重试。');return;}
if(typeof data.url==='string'&&data.url.startsWith('data:image/')){awaitingImage=false;armTimeout();art.src=data.url;}
else if(data.error){error('画廊暂时无法提供原画，请稍后重试。');}
});
function load(){
loaded=false;awaitingImage=embedded;schedule();$('loading').hidden=false;$('error').hidden=true;armTimeout();
if(embedded)parent.postMessage({type:'art-image-request',id:requested},'*');
else art.src='../wallpapers/'+requested+'.png';
}
function registerBridge(){window.WallpaperBridge.register({
 setPlaying(value){paused=!value;syncPause();},
 setSettings(value){if(Number.isFinite(value.speed))speed=Math.max(.25,Math.min(3,value.speed));if(Number.isFinite(value.power))power=Math.max(0,Math.min(3,value.power));render();schedule();},
 reset(){time=0;render();},getState(){return {playing:!paused};},
 snapshot(){render();const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;const c=out.getContext('2d'),ratio=canvas.width/W;c.fillStyle='#080c18';c.fillRect(0,0,out.width,out.height);c.drawImage(art,box.x*ratio,box.y*ratio,box.w*ratio,box.h*ratio);if(gl) c.drawImage(flow,0,0,out.width,out.height);c.drawImage(canvas,0,0);return out.toDataURL('image/png');}
});}
$('retry').onclick=load;syncPause();load();
})();
